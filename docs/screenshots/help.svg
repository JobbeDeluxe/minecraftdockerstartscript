<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="665" viewBox="0 0 1180 665" role="img" aria-label="Hilfe und Feldbeschreibung"><rect width="1180" height="665" fill="#111820"/><rect width="1180" height="64" fill="#18212b"/><text x="32" y="40" fill="#e8edf2" font-family="Segoe UI,Arial" font-size="25" font-weight="700">Minecraft Docker WebUI</text><text x="303" y="40" fill="#8fa0b2" font-family="Segoe UI,Arial" font-size="13">v1.0.0-rc1</text><rect x="32" y="92" width="1116" height="526" rx="10" fill="#151e27" stroke="#253240"/><text x="64" y="136" fill="#e8edf2" font-family="Segoe UI,Arial" font-size="24" font-weight="700">Hilfe</text><text x="64" y="166" fill="#8fa0b2" font-family="Segoe UI,Arial" font-size="14">Kurze, strukturierte Hilfe direkt im WebUI.</text><rect x="64" y="200" width="320" height="360" rx="8" fill="#0f151c" stroke="#334253"/><text x="88" y="236" fill="#e8edf2" font-family="Segoe UI,Arial" font-size="18" font-weight="700">Grundlagen</text><text x="88" y="274" fill="#9fb0c3" font-family="Segoe UI,Arial" font-size="14">ID: stabile Profilkennung</text><text x="88" y="306" fill="#9fb0c3" font-family="Segoe UI,Arial" font-size="14">Name: Anzeige im WebUI</text><text x="88" y="338" fill="#9fb0c3" font-family="Segoe UI,Arial" font-size="14">Container: Docker-Name</text><text x="88" y="370" fill="#9fb0c3" font-family="Segoe UI,Arial" font-size="14">Speichern schreibt Profilwerte</text><text x="88" y="402" fill="#9fb0c3" font-family="Segoe UI,Arial" font-size="14">Anwenden erzeugt/aendert Container</text><rect x="430" y="200" width="320" height="360" rx="8" fill="#0f151c" stroke="#334253"/><text x="454" y="236" fill="#e8edf2" font-family="Segoe UI,Arial" font-size="18" font-weight="700">Ports und RCON</text><text x="454" y="274" fill="#9fb0c3" font-family="Segoe UI,Arial" font-size="14">Minecraft: TCP 25565</text><text x="454" y="306" fill="#9fb0c3" font-family="Segoe UI,Arial" font-size="14">RCON: je Server eigener Port</text><text x="454" y="338" fill="#9fb0c3" font-family="Segoe UI,Arial" font-size="14">Geyser: UDP 19132 anpassen</text><rect x="796" y="200" width="320" height="360" rx="8" fill="#0f151c" stroke="#334253"/><text x="820" y="236" fill="#e8edf2" font-family="Segoe UI,Arial" font-size="18" font-weight="700">Backups und Plugins</text><text x="820" y="274" fill="#9fb0c3" font-family="Segoe UI,Arial" font-size="14">Backup zentral mit Servername</text><text x="820" y="306" fill="#9fb0c3" font-family="Segoe UI,Arial" font-size="14">Restore in bestehendes Profil</text><text x="820" y="338" fill="#9fb0c3" font-family="Segoe UI,Arial" font-size="14">Import aus .tar.gz als neues Profil</text><text x="820" y="370" fill="#9fb0c3" font-family="Segoe UI,Arial" font-size="14">Plugins: URL, Modrinth, Build</text><text x="820" y="402" fill="#9fb0c3" font-family="Segoe UI,Arial" font-size="14">Manuelle JARs hochladen/loeschen</text></svg>